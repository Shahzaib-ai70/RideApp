name: Build and deploy Sawaari website

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sawaari-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Export production website
        run: npm run build:web
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_WEB_API_KEY }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST" || { echo "::error::Add the VPS_HOST repository secret."; exit 1; }
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "::error::Add the VPS_SSH_PRIVATE_KEY repository secret."; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "::error::Add the VPS_KNOWN_HOSTS repository secret."; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload and restart VPS API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          test -n "$VPS_USER" || { echo "::error::Add the VPS_USER repository secret."; exit 1; }
          VPS_PORT="${VPS_PORT:-22}"
          SSH="ssh -i $HOME/.ssh/deploy_key -p $VPS_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          rsync -az --delete \
            -e "$SSH" \
            server/ "$VPS_USER@$VPS_HOST:/opt/sawaari-source/server/"
          rsync -az package.json package-lock.json \
            -e "$SSH" \
            "$VPS_USER@$VPS_HOST:/opt/sawaari-source/"
          $SSH "$VPS_USER@$VPS_HOST" 'cd /opt/sawaari-source && npm ci --omit=dev && sudo /usr/bin/systemctl restart sawaari-api && for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3210/api/health >/dev/null && exit 0; sleep 2; done; sudo /usr/bin/systemctl status sawaari-api --no-pager; exit 1'

      - name: Upload website to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          VPS_PORT="${VPS_PORT:-22}"
          rsync -az --delete --itemize-changes \
            -e "ssh -i $HOME/.ssh/deploy_key -p $VPS_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/ "$VPS_USER@$VPS_HOST:/var/www/sawaari/dist/"
